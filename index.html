</style><link rel="stylesheet" href="polish.css?v=20261114-edit"></head><body><aside><div class="brand"><span class="logo">▤</span>手順ノート</div><nav><button class="nav active" id="allnav">▤ <span>すべての手順書</span><span class="count" id="navcount">0</span></button><button class="nav" id="favnav">☆ <span>お気に入り</span></button></nav></aside><main><header class="topbar"><span>ライブラリ <span style="margin:0 12px;color:#c5ccc4">/</span> 手順書一覧</span><div class="account-tools"><span id="account-email"></span><button class="secondary" id="login">ログイン</button><button class="secondary" id="logout" hidden>ログアウト</button></div></header><section class="intro"><div><h1 id="heading">手順書一覧</h1></div><div class="page-actions"><button class="secondary" id="edit-mode" aria-pressed="false" disabled>✎ 編集</button><button class="primary" id="add">＋ 手順書を追加</button></div></section><section class="stats"><div class="stat"><div><small>すべての手順書</small><strong id="total">0</strong><strong><span>件</span></strong></div><div class="stat-icon">▤</div></div><div class="stat"><div><small>カテゴリ</small><strong>4<span>種類</span></strong></div><div class="stat-icon">▦</div></div><div class="stat"><div><small>お気に入り</small><strong id="favcount">0</strong><strong><span>件</span></strong></div><div class="stat-icon">☆</div></div></section><section class="cloud-panel"><div><b id="cloud-status" role="status">接続を確認しています…</b><p id="cloud-help"></p></div><div class="cloud-tools"><button class="secondary" id="refresh" hidden>再読み込み</button><button class="secondary" id="import-local" hidden>旧データを取り込む</button><button class="secondary" id="import-samples" hidden>サンプルを追加</button></div></section><div class="toolbar"><div class="search"><span>⌕</span><input id="search" aria-label="手順書を検索" placeholder="キーワードで手順書を検索..."></div><select class="sort" id="sort" aria-label="並び順"><option value="date">更新日が新しい順</option><option value="name">タイトル順</option></select></div><div class="tabs" id="tabs"></div><div class="listhead">手順書 <span id="results">
